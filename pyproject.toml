[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-financial-inclusion"
version = "0.1.0"
description = "Predicting bank-account ownership in East Africa, with an interactive Dash dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn==1.5.2",
    "imbalanced-learn==0.12.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dash = ["dash>=2.17", "plotly>=5.22"]
dev  = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=fia --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=100"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
source = ["fia", "app"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]